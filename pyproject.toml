[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faker-ai-provider"
version = "2.2.1"
description = "Generate realistic AI/ML test data: 180+ models, 30+ companies, 20+ frameworks, 30+ datasets, architectures, tasks, and parameters"
readme = "README.md"
authors = [{name = "Rodrigo Nogueira", email = "rodrigo.b.nogueira@gmail.com"}]
license = {text = "MIT"}
keywords = ["faker", "ai", "ml", "machine-learning", "fake-data", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "faker>=18.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/rodrigobnogueira/faker-ai-provider"
Repository = "https://github.com/rodrigobnogueira/faker-ai-provider"
Documentation = "https://github.com/rodrigobnogueira/faker-ai-provider#readme"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 200
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
lines-after-imports = 2
